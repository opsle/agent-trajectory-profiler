name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Fetch pinned public dependencies
        run: |
          git clone \
            https://github.com/opsle/context-firewall.git \
            ../context-firewall
          git -C ../context-firewall checkout \
            953c48f1cfd154d6b7ed10b51b87fe54e4df45f2
          git clone \
            https://github.com/opsle/decision-evidence-protocol.git \
            ../decision-evidence-protocol
          git -C ../decision-evidence-protocol checkout \
            b17ae3b41cea7cb0b9e0befe43e885b5aa0e4a09
      - run: npm run verify
